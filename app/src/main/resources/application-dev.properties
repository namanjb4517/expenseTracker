spring.application.name=app


#If application run outside docker in my local system
spring.datasource.url=jdbc:mysql://127.0.0.1:44406/authservice?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION =
# ===============================

# options: none | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080

#If application run outside docker in my local system
spring.kafka.bootstrap-servers=127.0.0.1:9092

spring.kafka.topic.name=testing_json
spring.kafka.producer.value-serializer=com.example.app.serializer.UserInfoSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka.core.KafkaTemplate=DEBUG